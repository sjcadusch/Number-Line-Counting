<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Multiplication Facts</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Multiplication Facts</h1>

      <form id="controls" class="controls" autocomplete="off">
        <label>
          Fact family (1–12)
          <input type="number" id="factFamily" min="1" max="12" value="2" step="1" />
        </label>

        <label>
          Display speed (ms)
          <input type="number" id="speed" value="900" min="150" step="50" />
        </label>

        <label>
          Order
          <select id="order">
            <option value="forward">Forwards (0 to 12)</option>
            <option value="backward">Backwards (12 to 0)</option>
            <option value="random">Random</option>
          </select>
        </label>

        <div class="actions">
          <button type="submit">Start</button>
          <button type="button" id="pause">Pause</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </form>

      <section class="status-panel">
        <p id="status">Enter a fact family from 1 to 12 and press Start.</p>
      </section>

      <section class="table-wrap" aria-label="Multiplication facts output">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Equation</th>
            </tr>
          </thead>
          <tbody id="factsBody"></tbody>
        </table>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
